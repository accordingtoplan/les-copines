# Uploads the site to lescopines.de (HostEurope, FTPS) on every push to main.
# Needs repo secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Only changed files go up; the action keeps its state in
# .ftp-deploy-sync-state.json on the server. V2 and the redirects stay off.
name: Deploy to lescopines.de

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            v2/**
            v5/**
            v6/**
