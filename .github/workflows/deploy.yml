# Uploads the site to lescopines.de (HostEurope, FTPS) on every push to main.
# Needs repo secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD; without them
# the run skips the upload and passes.
# Only changed files go up; the action keeps its state in
# .ftp-deploy-sync-state.json on the server. V2 and the redirects stay off.
name: Deploy to lescopines.de

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_PASSWORD" ]; then echo "connected=true" >> "$GITHUB_OUTPUT"
          else echo "No HostEurope secrets yet, skipping upload."; fi
      - if: steps.check.outputs.connected == 'true'
        uses: actions/checkout@v4
      # lescopines.de is V1 only: drop the V1/V2 switcher so nothing links to v2/
      - if: steps.check.outputs.connected == 'true'
        run: perl -0pi -e 's|<nav class="vs"[^>]*>.*?</nav>\n?||s' index.html && ! grep -q 'class="vs"' index.html
      - if: steps.check.outputs.connected == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            v2/**
            v5/**
            v6/**
